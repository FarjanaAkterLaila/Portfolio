<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sigilBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffc8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0.38" />
    </linearGradient>
    <filter id="sigilGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00ffc8" />
      <stop offset="100%" stop-color="#00d4a0" />
    </radialGradient>
  </defs>

  <!-- Dark cosmic base with rounded corners matching nav sigil -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" ry="14" fill="#070c1a" stroke="#00ffc8" stroke-width="2.5" stroke-opacity="0.9" />
  
  <!-- Subtle inner gradient glow -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" ry="14" fill="url(#sigilBg)" />

  <!-- 4-point Sigil Core (exact match to nav star icon) -->
  <g filter="url(#sigilGlow)">
    <path d="M 32 12 C 32 24.2 24.2 32 12 32 C 24.2 32 32 39.8 32 52 C 32 39.8 39.8 32 52 32 C 39.8 32 32 24.2 32 12 Z" fill="url(#starCore)" />
    <!-- Bright center pinpoint -->
    <circle cx="32" cy="32" r="3" fill="#ffffff" />
  </g>
</svg>
